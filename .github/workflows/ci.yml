name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TinkerCNC.slnx

      - name: Build
        run: dotnet build TinkerCNC.slnx --no-restore -c Release

      - name: Test
        run: dotnet test TinkerCNC.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Pack NuGet packages (validation only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/TinkerCNC.Core/TinkerCNC.Core.csproj -c Release --no-build -o artifacts/nuget
          dotnet pack src/TinkerCNC.Cli/TinkerCNC.Cli.csproj -c Release --no-build -o artifacts/nuget

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
