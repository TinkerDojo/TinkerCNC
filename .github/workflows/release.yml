# Builds the installers with Velopack and attaches them to the GitHub release of the pushed tag (v1.2.3), packs the
# NuGet packages (pushed to nuget.org when the NUGET_API_KEY secret exists) and publishes the container image to GHCR.
# Installed copies update from the release feed, because the build bakes in this repository's URL.
#
# Signing is not set up here: Windows SmartScreen warns on the first start and macOS Gatekeeper blocks the unsigned
# .pkg until the user allows it (see docs/releases.md). Written against vpk 1.2.x (dotnet-tools.json); check
# `dotnet vpk upload github --help` if an option is rejected.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        shell: pwsh
        run: '"version=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT'

      - name: Restore tools
        run: dotnet tool restore

      - name: Previous release (lets Velopack build a delta package)
        continue-on-error: true
        run: dotnet vpk download github --repoUrl "$env:REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" --channel win-x64 --outputDir artifacts/releases/win-x64

      - name: Pack
        shell: pwsh
        run: ./build/pack-windows.ps1 -Version ${{ steps.version.outputs.version }} -UpdatesUrl $env:REPO_URL -SourceUrl $env:REPO_URL

      - name: Upload to the GitHub release
        run: dotnet vpk upload github --repoUrl "$env:REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" --channel win-x64 --outputDir artifacts/releases/win-x64 --tag ${{ github.ref_name }} --releaseName "TinkerCNC ${{ steps.version.outputs.version }}" --merge --publish

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/releases/win-x64

  macos:
    name: macOS installer (${{ matrix.runtime }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore tools
        run: dotnet tool restore

      - name: Previous release (lets Velopack build a delta package)
        continue-on-error: true
        run: dotnet vpk download github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" --channel ${{ matrix.runtime }} --outputDir artifacts/releases/${{ matrix.runtime }}

      - name: Pack
        env:
          UPDATES_URL: ${{ env.REPO_URL }}
          SOURCE_URL: ${{ env.REPO_URL }}
        run: build/pack-macos.sh ${{ steps.version.outputs.version }} ${{ matrix.runtime }}

      - name: Upload to the GitHub release
        run: dotnet vpk upload github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" --channel ${{ matrix.runtime }} --outputDir artifacts/releases/${{ matrix.runtime }} --tag ${{ github.ref_name }} --releaseName "TinkerCNC ${{ steps.version.outputs.version }}" --merge --publish

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.runtime }}
          path: artifacts/releases/${{ matrix.runtime }}

  nuget:
    name: NuGet packages
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack src/TinkerCNC.Core/TinkerCNC.Core.csproj -c Release -o artifacts/nuget -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/TinkerCNC.Cli/TinkerCNC.Cli.csproj -c Release -o artifacts/nuget -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget

      - name: Push to nuget.org (only when the NUGET_API_KEY secret is set)
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  container:
    name: Container image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_URL=${{ env.REPO_URL }}
